font_family CaskaydiaCove Nerd Font
font_size 11.5
background #100f18
foreground #ece4f8
cursor #c5b4ff
cursor_text_color #100f18
selection_background #57406f
selection_foreground #ffffff
color0 #302c3c
color1 #ffb4ab
color2 #b8dbbc
color3 #f2d49c
color4 #b9c7ff
color5 #c5b4ff
color6 #a5d6db
color7 #ece4f8
color8 #847991
color9 #ffc8c2
color10 #cbeacc
color11 #ffe3af
color12 #d0d9ff
color13 #ddceff
color14 #bce9ec
color15 #ffffff
window_padding_width 22
hide_window_decorations yes
background_opacity 0.96
tab_bar_style powerline
tab_powerline_style round
active_tab_background #6b4c86
active_tab_foreground #f1e6ff
inactive_tab_background #21182e
inactive_tab_foreground #a79abb
cursor_shape beam
cursor_blink_interval 0.6
enable_audio_bell no
confirm_os_window_close 1
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
